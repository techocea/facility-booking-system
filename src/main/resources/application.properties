spring.application.name=facility-booking-system

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:facilitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL queries in terminal for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recreate schema on startup
spring.jpa.hibernate.ddl-auto=update
